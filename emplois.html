<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIO Alumni - Emplois</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo-link">
        <div class="logo-container">
          <img src="assets/Logo.png" alt="Logo MIO">
          <span>MIO Alumni</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li data-auth-required hidden><a href="auth.html?mode=signup" data-auth-redirect="stages.html">Stages</a></li>
        <li data-auth-required hidden><a href="auth.html?mode=signup" data-auth-redirect="emplois.html">Emplois</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="auth-buttons">
          <a href="auth.html?mode=login" class="btn btn-outline">Se connecter</a>
        <a href="auth.html?mode=signup" class="btn btn-primary">S'inscrire</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h2>Partager une expérience d'Emploi</h2>
    <div class="form-container">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m15 18-6-6 6-6"></path>
          <path d="M9 12h12"></path>
        </svg>
        <span>Retour</span>
      </a>
      <form id="jobForm">
        <div class="form-group">
          <label for="job_company">Nom de l'entreprise</label>
          <input type="text" id="job_company" required>
        </div>
        <div class="location-fields">
          <div class="form-group">
            <label for="region">Région</label>
            <input type="text" id="region" required>
          </div>
          <div class="form-group">
            <label for="city">Ville</label>
            <input type="text" id="city" required>
          </div>
        </div>
        <div class="form-group">
          <label for="job_sector">Secteur d'activité</label>
          <input type="text" id="job_sector" placeholder="Ex: Finance, Télécoms, Services" required>
        </div>
        <div class="form-group">
          <label for="job_title">Poste actuel / occupé</label>
          <input type="text" id="job_title" required>
        </div>
        <div class="form-group">
          <label for="contract_type">Type de contrat</label>
          <select id="contract_type" required>
            <option value="CDI">CDI</option>
            <option value="CDD">CDD</option>
            <option value="Freelance">Freelance</option>
            <option value="Entrepreneuriat">Entrepreneuriat</option>
          </select>
        </div>
        <button type="submit" class="btn btn-secondary" style="width: 100%;">Enregistrer l'emploi</button>
      </form>
    </div>

    <h2 style="margin-top: 3rem;">Insertion professionnelle des diplômés</h2>
    <div class="grid" id="jobsList"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
