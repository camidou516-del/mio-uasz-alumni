<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIO Alumni - Contact</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo-link">
        <div class="logo-container">
          <img src="assets/Logo.png" alt="Logo MIO">
          <span>MIO Alumni</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li data-auth-required hidden><a href="auth.html?mode=signup" data-auth-redirect="stages.html">Stages</a></li>
        <li data-auth-required hidden><a href="auth.html?mode=signup" data-auth-redirect="emplois.html">Emplois</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="auth-buttons">
          <a href="auth.html?mode=login" class="btn btn-outline">Se connecter</a>
        <a href="auth.html?mode=signup" class="btn btn-primary">S'inscrire</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h2>Contact & Support Amicale MIO</h2>
    <div class="form-container">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m15 18-6-6 6-6"></path>
          <path d="M9 12h12"></path>
        </svg>
        <span>Retour</span>
      </a>
      <form action="https://formspree.io/f/xeaowwyp" method="POST" id="contactForm">
        <div class="form-group">
          <label for="name">Nom complet</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Adresse E-mail</label>
          <input type="email" id="email" required>
        </div>
        <div class="location-fields">
          <div class="form-group">
            <label for="region">Région</label>
            <input type="text" id="region" required>
          </div>
          <div class="form-group">
            <label for="city">Ville</label>
            <input type="text" id="city" required>
          </div>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Envoyer le message</button>
      </form>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
