<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIO Alumni - Connexion & Inscription</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <div class="form-container">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m15 18-6-6 6-6"></path>
          <path d="M9 12h12"></path>
        </svg>
        <span>Retour</span>
      </a>
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a href="index.html" class="logo-link">
          <div class="logo-container">
            <img src="assets/Logo.png" alt="Logo MIO">
            <span>MIO Alumni</span>
          </div>
        </a>
      </div>

      <form id="authForm">
        <div class="form-group" id="fullNameGroup">
          <label for="auth_fullname">Nom complet</label>
          <input type="text" id="auth_fullname">
        </div>
        <div class="form-group" id="phoneGroup">
          <label for="auth_phone">Numéro de téléphone</label>
          <input type="tel" id="auth_phone" placeholder="+221 XX XXX XX XX">
        </div>
        <div class="form-group">
          <label for="auth_email">Adresse E-mail</label>
          <input type="email" id="auth_email" required>
        </div>
        <div class="form-group">
          <label for="auth_password">Mot de passe</label>
          <div class="password-input-wrapper">
            <input type="password" id="auth_password" required>
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Afficher le mot de passe" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m3 3 18 18"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a13.8 13.8 0 0 1-3 3.8"></path>
                <path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width: 100%;">S'inscrire</button>
      </form>

      <p style="margin-top: 1rem; text-align: center;">
        <a href="#" id="toggleAuthMode">Déjà inscrit ? Connectez-vous</a>
      </p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let isSignUp = true;
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('mode') === 'login') isSignUp = false;

    const toggleBtn = document.getElementById('toggleAuthMode');
    const fullNameGroup = document.getElementById('fullNameGroup');
    const phoneGroup = document.getElementById('phoneGroup');
    const submitBtn = document.getElementById('authSubmitBtn');
    const passwordInput = document.getElementById('auth_password');
    const togglePasswordBtn = document.getElementById('togglePassword');

    togglePasswordBtn.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';
      togglePasswordBtn.setAttribute('aria-pressed', String(!isVisible));
      togglePasswordBtn.setAttribute('aria-label', isVisible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
    });

    function updateUI() {
      if(isSignUp) {
        fullNameGroup.style.display = 'block';
        phoneGroup.style.display = 'block';
        submitBtn.textContent = "S'inscrire";
        toggleBtn.textContent = "Déjà inscrit ? Connectez-vous";
      } else {
        fullNameGroup.style.display = 'none';
        phoneGroup.style.display = 'none';
        submitBtn.textContent = "Se connecter";
        toggleBtn.textContent = "Pas encore de compte ? S'inscrire";
      }
    }
    updateUI();

    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isSignUp = !isSignUp;
      updateUI();
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth_email').value;
      const password = document.getElementById('auth_password').value;

      if(isSignUp) {
        const full_name = document.getElementById('auth_fullname').value;
        const phone = document.getElementById('auth_phone').value;

        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if(error) return alert("Erreur : " + error.message);

        if(data.user) {
          await supabaseClient.from('profiles').insert([{ id: data.user.id, full_name, email, phone }]);
          alert("Inscription réussie ! Vous pouvez maintenant naviguer sur la plateforme.");
          window.location.href = 'index.html';
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if(error) return alert("Erreur : " + error.message);
        alert("Connexion réussie !");
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
</html>
