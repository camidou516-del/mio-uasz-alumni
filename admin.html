<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - MIO Alumni</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo-link">
        <div class="logo-container">
          <img src="assets/Logo.png" alt="Logo MIO">
          <span>MIO Alumni</span>
        </div>
      </a>
      <div class="auth-buttons">
        <a href="auth.html?mode=login" class="btn btn-outline">Se connecter</a>
        <a href="auth.html?mode=signup" class="btn btn-primary">S'inscrire</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h2>Administration Générale MIO</h2>
    
    <!-- 3 Onglets exigés -->
    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchTab('users')">Utilisateurs</button>
      <button class="tab-btn" onclick="switchTab('stages')">Stages</button>
      <button class="tab-btn" onclick="switchTab('emplois')">Emplois</button>
    </div>

    <!-- Onglet 1: Utilisateurs -->
    <div id="users-tab" class="tab-content active">
      <table>
        <thead>
          <tr>
            <th>Nom Complet</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Rôle</th>
          </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>

    <!-- Onglet 2: Stages -->
    <div id="stages-tab" class="tab-content">
      <table>
        <thead>
          <tr>
            <th>Entreprise</th>
            <th>Secteur</th>
            <th>Poste</th>
            <th>Durée (Mois)</th>
          </tr>
        </thead>
        <tbody id="stagesTableBody"></tbody>
      </table>
    </div>

    <!-- Onglet 3: Emplois -->
    <div id="emplois-tab" class="tab-content">
      <table>
        <thead>
          <tr>
            <th>Entreprise</th>
            <th>Secteur d'activité</th>
            <th>Poste Occupé</th>
            <th>Type Contrat</th>
          </tr>
        </thead>
        <tbody id="emploisTableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
